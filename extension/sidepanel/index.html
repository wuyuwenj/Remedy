<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remedy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg width="120" height="36" viewBox="0 0 200 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="remedy-grad" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0284c7"/>
            <stop offset="50%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#059669"/>
          </linearGradient>
        </defs>
        <g>
          <path d="M 14 50 L 14 14 L 26 14 A 12 12 0 0 1 26 38 L 14 38 M 22 38 L 32 48 L 50 16"
                stroke="url(#remedy-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="50" cy="16" r="4.5" fill="#059669"/>
        </g>
        <text x="72" y="43" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="#fafafa">
          Remedy
        </text>
      </svg>
    </div>
    <span class="version">v1.0</span>
  </header>

  <!-- URL Bar -->
  <section class="url-section">
    <label class="url-label">Analyzing</label>
    <div class="url-bar">
      <svg class="url-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1.75a5.25 5.25 0 100 10.5 5.25 5.25 0 000-10.5zM1.75 7h10.5M7 1.75c1.38 1.5 2.17 3.52 2.19 5.25-.02 1.73-.81 3.75-2.19 5.25-1.38-1.5-2.17-3.52-2.19-5.25.02-1.73.81-3.75 2.19-5.25z" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="detected-url" class="url-text">Detecting...</span>
    </div>
  </section>

  <!-- Analyze Button -->
  <section class="action-section">
    <button id="analyze-btn" class="btn-primary" disabled>
      <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M14 8l-6-6v4H2v4h6v4l6-6z" fill="currentColor"/>
      </svg>
      <span>Analyze Performance</span>
    </button>
  </section>

  <!-- Agent Log -->
  <section id="agent-log-section" class="section hidden">
    <div class="section-header">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6" stroke="#6366f1" stroke-width="1.5"/>
        <path d="M8 5v3l2 1.5" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h2>Agent Log</h2>
      <span id="agent-status" class="status-badge">idle</span>
    </div>
    <div id="agent-log" class="agent-log"></div>
  </section>

  <!-- Baseline Metrics -->
  <section id="metrics-section" class="section hidden">
    <div class="section-header">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="8" width="3" height="6" rx="0.5" fill="#6366f1"/>
        <rect x="5.5" y="5" width="3" height="9" rx="0.5" fill="#6366f1" opacity="0.7"/>
        <rect x="10" y="2" width="3" height="12" rx="0.5" fill="#6366f1" opacity="0.5"/>
      </svg>
      <h2>Core Web Vitals</h2>
    </div>
    <div id="metrics-grid" class="metrics-grid"></div>
    <div id="lighthouse-section" class="lighthouse-section hidden"></div>
  </section>

  <!-- Suggestions -->
  <section id="suggestions-section" class="section hidden">
    <div class="section-header">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 1.5a4.5 4.5 0 012.5 8.25V12a1 1 0 01-1 1H6.5a1 1 0 01-1-1V9.75A4.5 4.5 0 018 1.5z" stroke="#f59e0b" stroke-width="1.3" fill="none"/>
        <path d="M6 14h4" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <h2>Suggestions</h2>
      <span id="suggestion-count" class="count-badge">0</span>
    </div>
    <div id="suggestions-list" class="suggestions-list"></div>
    <button id="test-selected-btn" class="btn-secondary hidden">
      <svg class="btn-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M11.5 7A4.5 4.5 0 112.5 7a4.5 4.5 0 019 0z" stroke="currentColor" stroke-width="1.3"/>
        <path d="M5.5 7l1.5 1.5L9 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Test Selected
    </button>
  </section>

  <!-- Optimization Results -->
  <section id="optimization-section" class="section hidden">
    <div class="section-header">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 14l4-5 3 3 5-8" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>Optimization Results</h2>
    </div>
    <div id="optimization-list" class="optimization-list"></div>
    <button id="export-all-btn" class="btn-secondary export-all-btn hidden">
      <svg class="btn-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M3 9.5v2a1 1 0 001 1h6a1 1 0 001-1v-2M7 1.5v7.5M4.5 6.5L7 9l2.5-2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Export All as Prompt
    </button>
  </section>

  <!-- Apply Fixes -->
  <section id="apply-section" class="section hidden">
    <button id="apply-fixes-btn" class="btn-success">
      <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M13.5 4.5l-7 7L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Apply Fixes to Page
    </button>
    <a id="view-report-link" class="report-link" href="#" target="_blank">
      View Full Report
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M4.5 2.5h5v5M9.5 2.5L2.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </section>

  <!-- Error State -->
  <section id="error-section" class="section hidden">
    <div class="error-card">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" stroke="#ef4444" stroke-width="1.5"/>
        <path d="M10 6v5M10 13v1" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p id="error-message">Something went wrong.</p>
      <button id="retry-btn" class="btn-secondary">Retry</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
